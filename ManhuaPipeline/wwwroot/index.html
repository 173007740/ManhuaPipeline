<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫创引擎｜首页</title>
    <link href="/lib/material-icons/material-icons.css" rel="stylesheet">
    <!-- 首页同样走 project-editor / dashboard 那套 HUD 皮肤：
         hud-static 是底座（.page / .panel / .primary / .status），hero 与两块内容区用参考站的 home-hero-v* 三个样式表。
         不再引 style.css / admin-theme.css —— 那两套是给旧的 landing 页做的，跟这一套混用会撞色。
         顶栏还是由 hud-chrome 统一改造（全过程不碰页面里的链接）。 -->
    <link rel="stylesheet" href="/css/hud-static.css?v=3">
    <link rel="stylesheet" href="/css/home-hero-v2.css?v=1">
    <link rel="stylesheet" href="/css/home-hero-v3.css?v=1">
    <link rel="stylesheet" href="/css/home-hero-v3-fixes.css?v=1">
    <link rel="stylesheet" href="/css/hud-chrome.css?v=10">
    <script src="/js/hud-chrome.js?v=10"></script>
    <style>
        /* hero 图是本地资源（2.6M 的 png，画质感感值这个尺寸），第一屏自己会裁切 */
        .hero-v3 > img { object-fit: cover; }

        /* 原型第一屏只有文案，这里补两个去处：进来的人多半就是想去工作台或起一部新剧 */
        .hero-v3-actions { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
        .hero-v3-actions a {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; text-decoration: none;
            font: 400 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .5px;
            border: 1px solid rgba(140, 180, 200, .3); color: #a9c1c6; background: rgba(4, 18, 28, .5); }
        .hero-v3-actions a:hover { color: var(--cyan); border-color: var(--cyan); background: #041821; }
        .hero-v3-actions a.primary { border-color: transparent; }

        /* 轮播与漫剧卡：里面的内容是从接口拉的真数据（出图记录 / 漫剧），
           所以封面图走内联 background-image；没有图时用 CSS 渐变兜底，不至于是个黑洞 */
        .image-slide { background-size: cover; background-position: center; }
        .image-slide > div { text-shadow: 0 2px 14px #000a; }
        .video-card { cursor: pointer; }
        .video-cover { background-size: cover; background-position: center; }
        .video-card.empty { opacity: .72; }
        @media (prefers-reduced-motion: reduce) { .hero-v3 > img { animation: none !important; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/index.html" class="logo" style="text-decoration:none;">MANGA ENGINE</a>
            <div class="nav-links" id="navLinks"></div>
            <span id="navUser" style="display:none;"></span>
            <span id="navGuest"></span>
        </div>
    </nav>

    <main class="page home-v2">
        <section class="hero hero-v3">
            <img src="/img/museframe-hero.png" alt="AI 漫剧创作世界">
            <div class="hero-v3-shade"></div>
            <div class="hero-v3-copy">
                <span class="hero-v3-kicker">AI COMIC FILMMAKING SYSTEM</span>
                <h1><small>让灵感</small><strong>直接开拍。</strong></h1>
                <p>故事、角色、场景、分镜与成片，在同一套智能导演工作流里持续生长。</p>
                <div class="hero-v3-actions">
                    <a class="primary" href="/pages/dashboard.html">进入工作台 <b>→</b></a>
                    <a href="/pages/project-editor.html"><b>＋</b> 新建漫剧</a>
                </div>
            </div>
        </section>

        <!-- 这一排原本是静态的四张示例图（雨夜信号 / 月下巡游…）。换成系统里真实的最近出图记录，
             』标题、来源、时间都是真的；封面图有就用，没有就留原有那套渐变底。 -->
        <header class="section-title image-title">
            <div><span>IMAGE GALLERY</span><h2>最近出图</h2></div>
            <div class="carousel-controls">
                <button type="button" data-carousel-prev aria-label="上一张">←</button>
                <button type="button" data-carousel-next aria-label="下一张">→</button>
            </div>
        </header>
        <section class="image-carousel" aria-label="最近出图轮播">
            <div class="image-carousel-track" id="slideTrack"></div>
        </section>

        <!-- 原型这里是四部示例漫剧。换成我自己库里的漫剧：标题、简介、封面都是真的，点进去是那一部的合集页。 -->
        <header class="section-title" id="videos">
            <div><span>NOW PLAYING</span><h2>我的漫剧</h2></div>
        </header>
        <section class="video-grid" id="dramaGrid"></section>
    </main>

    <footer class="status">
        <span>● ALL SYSTEMS OPERATIONAL</span>
        <b>NODE <i id="nodeId">042</i></b>
        <em>LOCAL WORKSPACE</em>
    </footer>

    <script src="/lib/jquery/jquery-3.7.1.min.js"></script>
    <script src="/js/app.js?v=2"></script>
    <script src="/js/home-carousel.js?v=1" defer></script>
    <script>
        function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
        function fmt(d) { return d ? String(d).slice(0, 10) : ""; }

        $(function () {
            loadDramas();
            loadSlides();
        });

        /* 我的漫剧：取前四部。没数据时给四张占位卡（提示去建一部），
           而不是照原型摆四部假剧 —— 首页写着别人编的名字，点进去又不是它，最让人困惑。 */
        function loadDramas() {
            $.get("/api/drama", function (list) {
                list = list || [];
                $("#nodeId").text(String(list.length).padStart(3, "0"));
                if (!list.length) {
                    $("#dramaGrid").html(
                        "<article class='video-card panel empty' data-new><div class='video-cover'><button>＋</button></div>"
                        + "<h3>还没有漫剧</h3><p>点这里创建第一部：填世界观、剧本素材与交付规格。</p></article>");
                    $("#dramaGrid [data-new]").click(function () { location.href = "/pages/project-editor.html"; });
                    return;
                }
                var h = "";
                list.slice(0, 4).forEach(function (dr) {
                    var cover = dr.coverImage ? "background-image:url(" + dr.coverImage + ")" : "";
                    h += "<article class='video-card panel' data-id='" + dr.dramaId + "' data-title='" + esc(dr.title) + "'>"
                        + "<div class='video-cover' style='" + cover + "'><button>▶</button></div>"
                        + "<h3>" + esc(dr.title) + "</h3>"
                        + "<p>" + esc(dr.description || "暂无描述") + "</p></article>";
                });
                $("#dramaGrid").html(h);
                $("#dramaGrid [data-id]").click(function () {
                    location.href = "/pages/project-manage.html?dramaId=" + $(this).data("id")
                                  + "&title=" + encodeURIComponent($(this).data("title") || "");
                });
            }).fail(function () { });
        }

        /* 最近出图：报告接口里那份 recent 是真实记录（近 30 天出图任务），取头几条当轮播内容。
           没有图片 URL 这一列，所以封面沿用 home-hero 自带的四张渐变场景（scene-a ~ d）。 */
        function loadSlides() {
            $.get("/api/dashboard/report?days=30", function (r) {
                var rec = (r && r.images && r.images.recent) || [];
                if (!rec.length) {
                    $("#slideTrack").html("<article class='image-slide scene-a'><div><span>GALLERY / 000</span>"
                        + "<h3>还没有出图记录</h3><p>在某一集里跑「角色资产 / 道具资产」后，这里会按时间排出来</p></div></article>");
                    return;
                }
                var tones = ["scene-a", "scene-b", "scene-c", "scene-d"];
                var h = "";
                rec.slice(0, 8).forEach(function (t, i) {
                    var st = t.st === "done" ? "已完成" : t.st === "failed" ? "失败" : "进行中";
                    h += "<article class='image-slide " + tones[i % tones.length] + "'>"
                        + "<div><span>" + esc(t.src || "IMAGE").toUpperCase() + " / " + String(i + 1).padStart(3, "0") + "</span>"
                        + "<h3>" + esc(t.title || "未命名任务") + "</h3>"
                        + "<p>" + esc(t.kind || "") + " · " + st + " · " + fmt(t.updatedAt) + "</p></div></article>";
                });
                $("#slideTrack").html(h);
            }).fail(function () { });
        }
    </script>
</body>
</html>
