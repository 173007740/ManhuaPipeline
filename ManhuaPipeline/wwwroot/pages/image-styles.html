<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>图片风格管理 - 漫创引擎</title>
  <link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin-theme.css">
  <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
  <link href="/lib/material-icons/material-icons.css" rel="stylesheet">
  <style>
    .container{max-width:100%;padding:32px 24px;}
    .page-title{font-size:24px;font-weight:700;margin-bottom:24px;color:var(--primary-light);}
    .action-bar{display:flex;gap:12px;align-items:center;}
    .btn-grad{background:linear-gradient(135deg,#6af7ff,#0b8f99);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .btn-grad:hover{opacity:0.9;}
    .style-table{width:100%;border-collapse:collapse;background:rgba(30,41,59,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;}
    .style-table th{background:rgba(5,232,240,0.25);color:#c4b5fd;font-size:13px;font-weight:600;padding:10px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.08);}
    .style-table td{padding:10px 14px;color:#e2e8f0;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:middle;}
    .style-table tr:hover td{background:rgba(255,255,255,0.03);}
    .btn-edit{background:#475569;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;}
    .btn-del{background:#ef4444;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;margin-left:6px;}
    .img-thumb{width:72px;height:44px;object-fit:cover;border-radius:4px;border:1px solid #334155;display:block;}
  </style>
</head>
<body>
  <div id="particleWrap" style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;"><canvas id="particleCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas></div>
  <div style="position:relative;z-index:1;">
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo" style="display:flex;align-items:flex-end;gap:12px;padding-bottom:8px;text-decoration:none;">
        <span style="font-size:22px;font-weight:800;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;"><img src="/favicon.png" style="width:22px;height:22px;vertical-align:middle;display:inline-block;" alt=""> MANGA ENGINE 漫创引擎</span>
        <span style="font-size:11px;font-weight:400;color:var(--text-muted);letter-spacing:0.3px;white-space:nowrap;">✦ MANGA ENGINE · AI 驱动漫创引擎 · 叙事导演工作台</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="../index.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">home</span> 首页</a>
        <a href="dashboard.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">grid_view</span> 我的工作台</a>
        <a href="system-config.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">tune</span> 系统配置</a>
        <span id="navUser" style="display:none;">
          <span id="userName" style="margin-left:8px;color:var(--primary-light);font-size:14px;"></span>
          <a href="#" id="btnLogout" style="margin-left:8px;color:var(--danger);font-size:13px;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">logout</span> 退出</a>
        </span>
        <span id="navGuest" style="display:none;">
          <a href="register.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">person_add</span> 注册</a>
          <a href="login.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">account_circle</span> 登录</a>
        </span>
      </div>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <div class="page-title" style="margin-bottom:0;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">palette</span> 图片风格管理<span style="color:#789096;font-size:13px;font-weight:400;margin-left:8px;">无限画布节点的「图片风格」下拉直接读这里，不依赖所属项目</span></div>
      <div class="action-bar">
        <button class="btn-grad" onclick="openStyleModal()"><i class="fas fa-plus"></i> 新增风格</button>
      </div>
    </div>

    <table class="style-table" id="styleTable">
      <thead>
        <tr><th style="width:60px;">ID</th><th style="width:96px;">风格图</th><th style="width:110px;">分类</th><th style="width:160px;">风格名称</th>
            <th>正向提示词（出图时拼进提示词）</th><th>反向提示词（并入负面词）</th><th style="width:150px;">操作</th></tr>
      </thead>
      <tbody id="styleBody"><tr><td colspan="7" style="text-align:center;color:#789096;padding:24px;">加载中...</td></tr></tbody>
    </table>
  </div>

  <div id="styleModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:2000;justify-content:center;align-items:center;" onclick="if(event.target===this)closeStyleModal()">
    <div style="background:#061923;border-radius:12px;padding:24px;max-width:560px;width:90%;border:1px solid rgba(255,255,255,0.1);max-height:88vh;overflow:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="color:#f1f1f5;font-size:16px;margin:0;"><span class="material-icons" style="font-size:inherit;vertical-align:middle;color:#6af7ff">palette</span> <span id="styleModalTitle">新增风格</span></h3>
        <button onclick="closeStyleModal()" style="background:none;border:none;color:#789096;font-size:20px;cursor:pointer;">&times;</button>
      </div>
      <div style="margin-bottom:14px;">
        <label style="color:#cbd5e1;font-size:13px;display:block;margin-bottom:6px;">风格名称（画布下拉里显示的就是它）</label>
        <input id="styleName" type="text" placeholder="如：日系动漫、写实电影感、水墨国风" style="width:100%;box-sizing:border-box;background:#041017;color:#e2e8f0;border:1px solid #475569;border-radius:6px;padding:10px 12px;font-size:14px;">
      </div>
      <div style="margin-bottom:14px;">
        <label style="color:#cbd5e1;font-size:13px;display:block;margin-bottom:6px;">分类（只用来分组显示，不进提示词）</label>
        <select id="styleCategory" style="width:100%;box-sizing:border-box;background:#041017;color:#e2e8f0;border:1px solid #475569;border-radius:6px;padding:10px 12px;font-size:14px;">
          <option value="">未分类</option>
          <option value="2D动画">2D动画</option>
          <option value="3D动画">3D动画</option>
          <option value="真人影视">真人影视</option>
          <option value="漫画与插画">漫画与插画</option>
        </select>
      </div>
      <div style="margin-bottom:14px;">
        <label style="color:#cbd5e1;font-size:13px;display:block;margin-bottom:6px;">正向提示词（出图时整段拼进提示词）</label>
        <textarea id="styleDesc" rows="4" placeholder="如：日系动漫风格，线条干净流畅，色彩明快清新，角色大眼睛萌系表情" style="width:100%;box-sizing:border-box;background:#041017;color:#e2e8f0;border:1px solid #475569;border-radius:6px;padding:10px 12px;font-size:14px;resize:vertical;"></textarea>
      </div>
      <div style="margin-bottom:14px;">
        <label style="color:#cbd5e1;font-size:13px;display:block;margin-bottom:6px;">反向提示词（这条风格该避开什么，出图时并入负面词）</label>
        <textarea id="styleNegative" rows="3" placeholder="如：真人照片，蜡像皮肤，塑料材质，错误肢体，多余手指，随机文字，水印" style="width:100%;box-sizing:border-box;background:#041017;color:#e2e8f0;border:1px solid #475569;border-radius:6px;padding:10px 12px;font-size:14px;resize:vertical;"></textarea>
        <div style="color:#5c7078;font-size:12px;margin-top:6px;">不填也行 —— 那时只按资产卡上那条与模版里的通用负面词出图</div>
      </div>
      <div style="margin-bottom:20px;">
        <label style="color:#cbd5e1;font-size:13px;display:block;margin-bottom:6px;">风格图（只作预览缩略图，不送进模型）</label>
        <div style="display:flex;align-items:center;gap:12px;">
          <img id="imgPreview" class="img-thumb" style="display:none;" alt="">
          <input id="imgFile" type="file" accept="image/*" onchange="onPickImage(this)" style="color:#cbd5e1;font-size:13px;">
          <button type="button" onclick="clearImage()" style="background:#475569;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;">清除</button>
        </div>
        <div id="imgHint" style="color:#5c7078;font-size:12px;margin-top:6px;">不选也行 —— 只影响挑风格时看不看得见图</div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button onclick="closeStyleModal()" style="background:#475569;color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:14px;cursor:pointer;">取消</button>
        <button onclick="saveStyle()" style="background:linear-gradient(135deg,#6af7ff,#0b8f99);color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:600;">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="/lib/jquery/jquery-3.7.1.min.js"></script>
<script src="../js/app.js?v=2"></script>
<script>
var editingStyleId = null;
var pendingImageUrl = null;   // 弹窗里当前这张风格图（编辑时带出来，或刚上传的）

function loadStyles() {
  $.get("/api/image-style", function (list) {
    var h = "";
    if (!list || list.length === 0) {
      h = '<tr><td colspan="7" style="text-align:center;color:#789096;padding:24px;">还没有风格 —— 点右上角「新增风格」加一条，加了之后无限画布的「图片风格」下拉里就能选它</td></tr>';
    } else {
      /* 按分类分组：16 条摊平着挑得靠名字猜是哪一路画风。
         分类为空的那几条（自己后来加的）归到「未分类」，排在最后。 */
      var groups = {}, order = [];
      list.forEach(function(s){
        var k = s.category || "未分类";
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(s);
      });
      order.sort(function(a, b){
        if (a === "未分类") return 1;
        if (b === "未分类") return -1;
        return a.localeCompare(b, "zh");
      });
      order.forEach(function(k){
        var rows = groups[k];
        rows.forEach(function(s, idx){
          var img = s.styleImageUrl
            ? '<img class="img-thumb" src="' + escHtml(s.styleImageUrl) + '" alt="">'
            : '<span style="color:#5c7078;font-size:12px;">无图</span>';
          var pos = (s.styleDesc || "").length > 90 ? (s.styleDesc || "").slice(0, 90) + '…' : (s.styleDesc || "");
          var neg = (s.styleNegative || "").length > 60 ? (s.styleNegative || "").slice(0, 60) + '…' : (s.styleNegative || "");
          h += "<tr><td>" + s.styleId + "</td><td>" + img + "</td>"
            /* 分类只在每组第一行写一次，配上「共 N 条」，一眼看出这一组有多大 */
            + (idx === 0 ? "<td rowspan='" + rows.length + "' style='color:#6af7ff;font-weight:600;vertical-align:top;'>" + escHtml(k)
                          + "<div style='color:#5c7078;font-weight:400;font-size:12px;margin-top:2px;'>共 " + rows.length + " 条</div></td>" : "")
            + "<td style='font-weight:600;color:#f1f1f5;'>" + escHtml(s.styleName) + "</td>"
            + "<td title='" + escHtml(s.styleDesc) + "'>" + escHtml(pos) + "</td>"
            + (neg ? "<td title='" + escHtml(s.styleNegative) + "' style='color:#94a3b8;'>" + escHtml(neg) + "</td>"
                   : "<td style='color:#5c7078;'>（无）</td>")
            + "<td><button class='btn-edit' onclick='openStyleModal(" + s.styleId + ")'><i class='fas fa-pen'></i> 编辑</button>"
            + "<button class='btn-del' onclick='deleteStyle(" + s.styleId + ")'><i class='fas fa-trash'></i> 删除</button></td></tr>";
        });
      });
    }
    $("#styleBody").html(h);
  }).fail(function () { $("#styleBody").html('<tr><td colspan="7" style="text-align:center;color:#ef4444;padding:24px;">加载失败</td></tr>'); });
}

function openStyleModal(styleId) {
  editingStyleId = styleId || null;
  pendingImageUrl = null;
  $("#styleName").val("");
  $("#styleDesc").val("");
  $("#styleNegative").val("");
  $("#styleCategory").val("");
  $("#imgFile").val("");
  $("#imgPreview").hide().removeAttr("src");
  $("#imgHint").text("不选也行 —— 只影响挑风格时看不看得见图");
  if (editingStyleId) {
    $("#styleModalTitle").text("编辑风格");
    $.get("/api/image-style", function (list) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].styleId === editingStyleId) {
          $("#styleName").val(list[i].styleName);
          $("#styleDesc").val(list[i].styleDesc);
          $("#styleNegative").val(list[i].styleNegative || "");
          $("#styleCategory").val(list[i].category || "");
          if (list[i].styleImageUrl) setPreview(list[i].styleImageUrl);
          break;
        }
      }
    });
  } else {
    $("#styleModalTitle").text("新增风格");
  }
  $("#styleModal").css("display", "flex");
}

function closeStyleModal() { $("#styleModal").hide(); }

function setPreview(url) {
  pendingImageUrl = url;
  $("#imgPreview").attr("src", url).show();
}

function clearImage() {
  pendingImageUrl = null;
  $("#imgFile").val("");
  $("#imgPreview").hide().removeAttr("src");
  $("#imgHint").text("已清除，保存后这条风格就没有预览图");
}

// 选了图就直接传：先拿到地址，保存时随表单一起提交，省得表单里塞文件
function onPickImage(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  var fd = new FormData();
  fd.append("file", f);
  $("#imgHint").text("上传中…");
  $.ajax({
    url: "/api/image-style/upload", method: "POST",
    data: fd, processData: false, contentType: false,
    success: function (r) { setPreview(r.url); $("#imgHint").text("已上传，点「保存」生效"); },
    error: function (x) { $("#imgHint").text("上传失败：" + ((x.responseJSON && x.responseJSON.message) || x.statusText)); }
  });
}

function saveStyle() {
  var name = $("#styleName").val().trim();
  var desc = $("#styleDesc").val().trim();
  var neg = $("#styleNegative").val().trim();
  var cat = $("#styleCategory").val();
  if (!name) { alert("请输入风格名称"); return; }
  if (!desc) { alert("请输入正向提示词 —— 出图时拼进提示词的就是这段"); return; }
  $.ajax({
    url: "/api/image-style",
    method: "POST",
    contentType: "application/json",
    data: JSON.stringify({ styleId: editingStyleId, styleName: name, styleDesc: desc,
                           styleNegative: neg, category: cat, styleImageUrl: pendingImageUrl }),
    success: function () { closeStyleModal(); loadStyles(); },
    error: function (x) { alert("保存失败: " + ((x.responseJSON && x.responseJSON.message) || x.statusText)); }
  });
}

function deleteStyle(styleId) {
  if (!confirm("确定删除该风格？\n画布上选了它的节点会退回「不套用风格」（已出的图不受影响）。")) return;
  $.ajax({
    url: "/api/image-style/" + styleId,
    method: "DELETE",
    success: function () { loadStyles(); },
    error: function (x) { alert("删除失败: " + ((x.responseJSON && x.responseJSON.message) || x.statusText)); }
  });
}

$(function () {
  $.get("/api/auth/me", function (user) {
    if (!user || user.userId === 0) { window.location.href = "login.html"; return; }
  });
  loadStyles();
});
</script>
<script>
(function() {
    var c = document.getElementById("particleCanvas");
    if (!c) return;
    c.style.top = "0"; c.style.width = "100%"; c.style.pointerEvents = "none";
    var ctx = c.getContext("2d");
    var W, H;
    function resize(){ W=c.width=window.innerWidth; H=c.height=window.innerHeight; }
    resize(); window.addEventListener("resize", resize);
    var p = [], COUNT = 70;
    var colors = ["rgba(5,232,240,", "rgba(0,170,180,", "rgba(106,247,255,"];
    for (var i = 0; i < COUNT; i++) p.push({
      x:Math.random()*W, y:Math.random()*H, r:Math.random()*2+1.2,
      dx:(Math.random()-0.5)*0.4, dy:(Math.random()-0.5)*0.4-0.15,
      color:colors[Math.floor(Math.random()*3)], alpha:Math.random()*0.4+0.15
    });
    var DIST = 130;
    !function anim(){
      ctx.clearRect(0,0,W,H);
      for (var i = 0; i < COUNT; i++) {
        var q = p[i]; q.x += q.dx; q.y += q.dy;
        if (q.x < 0 || q.x > W) q.dx *= -1;
        if (q.y < 0 || q.y > H) q.dy *= -1;
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI*2);
        ctx.fillStyle = q.color + q.alpha + ")"; ctx.fill();
        for (var j = i+1; j < COUNT; j++) {
          var r = p[j], dx = q.x - r.x, dy = q.y - r.y, d = Math.sqrt(dx*dx+dy*dy);
          if (d < DIST) {
            var a = (1 - d/DIST) * 0.2;
            ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(r.x, r.y);
            ctx.strokeStyle = "rgba(5,232,240," + a + ")"; ctx.lineWidth = 0.6; ctx.stroke();
          }
        }
      }
      requestAnimationFrame(anim);
    }();
  })();

</script>
</body>
</html>
