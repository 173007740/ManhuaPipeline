<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>打斗库 - 漫创引擎</title>
    <link rel="stylesheet" href="/lib/material-icons/material-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .container { max-width: 100%; padding: 32px 24px; }
        .fight-list { margin-top: 8px; display: flex; flex-direction: column; gap: 12px; }
        .fight-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
        .fight-card:hover { border-color: var(--primary); background: var(--bg-card-hover); }
        .fight-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .fight-title .name { font-size: 15px; font-weight: 700; color: #e2e8f0; }
        .tier-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .tier-1 { background: rgba(249,115,22,0.15); color: #fb923c; }
        .tier-2 { background: rgba(239,68,68,0.15); color: #f87171; }
        .tier-3 { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .tier-4 { background: rgba(168,85,247,0.15); color: #c084fc; }
        .tier-5 { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .dur-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(16,185,129,0.15); color: #34d399; font-weight: 600; }
        .meta-line { font-size: 12px; color: #94a3b8; margin-bottom: 8px; line-height: 1.7; }
        .meta-line b { color: #cbd5e1; font-weight: 600; }
        .prompt-head { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .prompt-head label { font-size: 12px; color: #64748b; font-weight: 600; }
        .prompt-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; padding: 8px 10px; margin-top: 4px; font-size: 12px; color: #94a3b8; line-height: 1.6; white-space: pre-wrap; }
        .btn-xs { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: none; cursor: pointer; color: #fff; background: #475569; }
        .btn-xs.primary { background: #7c3aed; }
        .btn-xs.green { background: #10b981; }
        .btn-xs.red { background: #ef4444; }
        .tag-mini { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: rgba(236,72,153,0.15); color: #f472b6; }
        .fight-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .lib-tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tab-btn { font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: #94a3b8; cursor: pointer; }
        .tab-btn.active { background: var(--accent-gradient); color: #fff; border-color: transparent; }
        .arc-list { margin-top: 8px; display: flex; flex-direction: column; gap: 12px; }
        .arc-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
        .arc-card:hover { border-color: var(--primary); background: var(--bg-card-hover); }
        .arc-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .arc-title .name { font-size: 15px; font-weight: 700; color: #e2e8f0; }
        .arc-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(59,130,246,0.15); color: #60a5fa; font-weight: 600; }
        .arc-version { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(245,158,11,0.15); color: #fbbf24; font-weight: 600; }
        .arc-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .arc-status.active { background: rgba(16,185,129,0.15); color: #34d399; }
        .arc-status.inactive { background: rgba(239,68,68,0.15); color: #f87171; }
        .arc-phases { margin-top: 8px; }
        .arc-phases summary { cursor: pointer; font-size: 12px; color: #7c3aed; font-weight: 600; }
        .phase-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; overflow: hidden; }
        .phase-table th { background: #2d3748; color: #e2e8f0; padding: 7px 8px; text-align: left; white-space: nowrap; }
        .phase-table td { padding: 7px 8px; color: #94a3b8; border-top: 1px solid #1e293b; vertical-align: top; }
        .arc-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    </style>
</head>

        <div class="nav-inner">
            <a href="../index.html" class="logo" style="display:flex;align-items:flex-end;gap:12px;padding-bottom:8px;text-decoration:none;">

                <span style="font-size:11px;font-weight:400;color:var(--text-muted);letter-spacing:0.3px;white-space:nowrap;">✦ MANGA ENGINE · AI 驱动漫创引擎 · 叙事导演工作台</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="../index.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">home</span> 首页</a>
                <a href="dashboard.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">grid_view</span> 我的工作台</a>
                <a href="asset-library.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">folder_open</span> 图片资产库</a>
                <a href="skill-library.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">bolt</span> 技能库</a>
                <a href="fight-library.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">sports_martial_arts</span> 打斗库</a>
                <a href="camera-atom-library.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">movie_filter</span> 运镜原子库</a>
                <span id="navUser" style="display:none;">
                    <a href="profile.html" style="margin-left:8px;color:var(--primary-light);font-size:14px;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">settings</span> 个人设置</a>
                    <span id="userName" style="margin-left:8px;color:var(--primary-light);font-size:14px;"></span>

                </span>
                <span id="navGuest" style="display:none;">
                    <a href="register.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">person_add</span> 注册</a>
                    <a href="login.html" style="color:var(--primary-light);text-decoration:none;padding:8px 16px;font-size:14px;font-weight:500;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">account_circle</span> 登录</a>

    <div class="container">
        <div class="lib-tabs">
            <button class="tab-btn active" onclick="switchTab('fights', this)">打斗模板</button>
            <button class="tab-btn" onclick="switchTab('arcs', this)">战斗骨架<span class="arc-count" style="margin-left:4px;color:#94a3b8;font-size:11px;"></span></button>
        </div>
        <div id="tabFights">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
                <div class="page-title" style="margin-bottom:0;font-size:24px;font-weight:700;"><span class="material-icons" style="font-size:inherit;vertical-align:middle">sports_martial_arts</span> 打斗库<span class="fight-count" style="color:#94a3b8;font-size:13px;font-weight:400;margin-left:8px;"></span></div>
                <div class="action-bar" style="margin-bottom:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
                    <div style="display:flex;align-items:center;margin-right:8px;"><input type="text" id="searchInput" placeholder="搜索模板名/标签..." style="background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:10px 10px;font-size:13px;width:180px;box-sizing:border-box;" onkeydown="if(event.key==='Enter')loadFights()"></div>
                    <div style="display:flex;align-items:center;margin-right:8px;">
                        <select id="filterTier" onchange="loadFights()" style="background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:10px;font-size:13px;">
                            <option value="">全部层级</option>
                            <option value="1">T1 拳拳到肉</option>
                            <option value="2">T2 刀兵对砍</option>
                            <option value="3">T3 技能拉满</option>
                            <option value="4">T4 特效拉满</option>
                            <option value="5">T5 大招释放</option>
                        </select>
                    </div>
                    <div style="display:flex;align-items:center;margin-right:8px;">
                        <select id="filterDur" onchange="loadFights()" style="background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:10px;font-size:13px;">
                            <option value="">全部时长</option>
                            <option value="5">5秒</option>
                            <option value="11">11秒</option>
                            <option value="15">15秒</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="showAdd()"><span class="material-icons" style="font-size:inherit;vertical-align:middle">add</span> 新增模板</button>
                </div>
            </div>
            <div id="fightList" class="fight-list"></div>
            <div id="fightEmpty" style="display:none;text-align:center;padding:60px 20px;color:#94a3b8;font-size:15px;">暂无打斗模板，点击「新增模板」创建</div>
        </div>
        <div id="tabArcs" style="display:none;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:12px;">

                <div style="font-size:12px;color:#64748b;">骨架由导演层读取，分集细化和分镜按阶段顺序生成</div>
            </div>
            <div id="arcList" class="arc-list"></div>
            <div id="arcEmpty" style="display:none;text-align:center;padding:60px 20px;color:#94a3b8;font-size:15px;">暂无战斗骨架</div>
        </div>
    </div>

    <div id="editModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:2000;align-items:center;justify-content:center;">
        <div style="background:#1e293b;border-radius:12px;padding:24px;width:760px;max-width:94%;max-height:92vh;overflow:auto;">
            <h3 id="modalTitle" style="color:#f1f5f9;margin:0 0 16px;font-size:16px;">新增模板</h3>
            <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
                <div style="flex:1;min-width:200px;">
                    <label style="font-size:12px;color:#94a3b8;">模板名</label>
                    <input id="fName" style="width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:8px 10px;font-size:13px;margin-top:4px;">
                </div>
                <div style="width:130px;">
                    <label style="font-size:12px;color:#94a3b8;">层级</label>
                    <select id="fTier" style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:8px;font-size:13px;margin-top:4px;">
                        <option value="1">T1 拳拳到肉</option>
                        <option value="2">T2 刀兵对砍</option>
                        <option value="3" selected>T3 技能拉满</option>
                        <option value="4">T4 特效拉满</option>
                        <option value="5">T5 大招释放</option>
                    </select>
                </div>
                <div style="width:110px;">
                    <label style="font-size:12px;color:#94a3b8;">时长</label>
                    <select id="fDur" style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:8px;font-size:13px;margin-top:4px;">
                        <option value="5">5秒</option>
                        <option value="11" selected>11秒</option>
                        <option value="15">15秒</option>
                    </select>
                </div>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:12px;color:#94a3b8;">适用场景</label>
                <input id="fScene" style="width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:8px 10px;font-size:13px;margin-top:4px;">
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:12px;color:#94a3b8;">节拍</label>
                <input id="fBeat" placeholder="如：快攻三连 → 格挡反打 → 僵持（顿帧）→ 震开" style="width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:8px 10px;font-size:13px;margin-top:4px;">
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:12px;color:#94a3b8;">动作行</label>
                <textarea id="fAction" rows="3" style="width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:8px 10px;font-size:13px;margin-top:4px;resize:vertical;"></textarea>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:12px;color:#94a3b8;">运镜行</label>
                <textarea id="fCamera" rows="3" style="width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:8px 10px;font-size:13px;margin-top:4px;resize:vertical;"></textarea>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:12px;color:#94a3b8;">约束行</label>
                <textarea id="fConstraint" rows="3" style="width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:8px 10px;font-size:13px;margin-top:4px;resize:vertical;"></textarea>
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:12px;color:#94a3b8;">标签（逗号分隔）</label>
                <input id="fTags" placeholder="如：对砍,正反打,格挡" style="width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:8px 10px;font-size:13px;margin-top:4px;">
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn" onclick="$('#editModal').hide()">取消</button>
                <button class="btn btn-primary" onclick="doSave()">保存</button>
            </div>
        </div>
    </div>

    <script src="/lib/jquery/jquery-3.7.1.min.js"></script>
    <script src="../js/app.js?v=2"></script>
    <script>
        var _editId = 0;
        var tierNames = { 1: 'T1 拳拳到肉', 2: 'T2 刀兵对砍', 3: 'T3 技能拉满', 4: 'T4 特效拉满', 5: 'T5 大招释放' };
        var tierClasses = { 1: 'tier-1', 2: 'tier-2', 3: 'tier-3', 4: 'tier-4', 5: 'tier-5' };

        function switchTab(name, btn) {
            $('.tab-btn').removeClass('active');
            $(btn).addClass('active');
            $('#tabFights').toggle(name === 'fights');
            $('#tabArcs').toggle(name === 'arcs');
        }

        function loadFights() {
            var tier = $('#filterTier').val();
            var dur = $('#filterDur').val();
            var search = $('#searchInput').val();
            $.get('/api/fight/list', { tier: tier || undefined, duration: dur || undefined, search: search }, function (d) {
                if (!d || d.length === 0) { $('#fightList').empty(); $('#fightEmpty').show(); $('.fight-count').text(''); return; }
                $('#fightEmpty').hide();
                var h = '';
                for (var i = 0; i < d.length; i++) {
                    var t = d[i];
                    var tierCls = tierClasses[t.tier] || 'tier-3';
                    h += '<div class="fight-card">';
                    h += '<div class="fight-title"><span class="name">' + escHtml(t.name) + '</span>';
                    h += '<span class="tier-badge ' + tierCls + '">' + (tierNames[t.tier] || 'T' + t.tier) + '</span>';
                    h += '<span class="dur-badge">' + (t.duration || 11) + 's</span></div>';
                    if (t.scene) { h += '<div class="meta-line"><b>适用：</b>' + escHtml(t.scene) + '</div>'; }
                    if (t.beat) { h += '<div class="meta-line"><b>节拍：</b>' + escHtml(t.beat) + '</div>'; }
                    h += '<div class="prompt-head"><label>动作行</label><button class="btn-xs" onclick="copyOne(this,' + t.fightTemplateId + ',\'action\')">复制</button></div>';
                    h += '<div class="prompt-box">' + escHtml(t.actionPrompt || '（空）') + '</div>';
                    h += '<div class="prompt-head"><label>运镜行</label><button class="btn-xs" onclick="copyOne(this,' + t.fightTemplateId + ',\'camera\')">复制</button></div>';
                    h += '<div class="prompt-box">' + escHtml(t.cameraPrompt || '（空）') + '</div>';
                    h += '<div class="prompt-head"><label>约束行</label><button class="btn-xs" onclick="copyOne(this,' + t.fightTemplateId + ',\'constraint\')">复制</button></div>';
                    h += '<div class="prompt-box">' + escHtml(t.constraintPrompt || '（空）') + '</div>';
                    if (t.tags) {
                        var tagArr = String(t.tags).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
                        if (tagArr.length > 0) { h += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;">'; for (var ti = 0; ti < tagArr.length; ti++) { h += '<span class="tag-mini">#' + escHtml(tagArr[ti]) + '</span>'; } h += '</div>'; }
                    }
                    h += '<div class="fight-actions">';
                    h += '<button class="btn-xs primary" onclick="copyFull(this,' + t.fightTemplateId + ')">复制完整提示词</button>';
                    h += '<button class="btn-xs" onclick="showEdit(' + t.fightTemplateId + ')">编辑</button>';
                    h += '<button class="btn-xs red" onclick="delFight(' + t.fightTemplateId + ')">删除</button>';
                    h += '</div></div>';
                }
                $('#fightList').html(h);
                $('.fight-count').text('共 ' + d.length + ' 个模板');
            }).fail(function () { $('#fightList').html('<p style="color:#ef4444;text-align:center;">加载失败</p>'); });
        }

        function loadArcs() {
            $.get('/api/fight-arc/list', function (d) {
                if (!Array.isArray(d) || d.length === 0) { $('#arcList').empty(); $('#arcEmpty').show(); $('.arc-count').text(''); $('.arc-total').text(''); return; }
                $('#arcEmpty').hide();
                var h = '';
                for (var i = 0; i < d.length; i++) {
                    var t = d[i];
                    var budget = t.durationBudget || {};
                    var tiers = (budget.shotTiers || []).map(function (s) { return s + 's'; }).join('/') || '5s/11s/15s';
                    h += '<div class="arc-card">';
                    h += '<div class="arc-title"><span class="name">' + escHtml(t.name) + '</span>';
                    h += '<span class="arc-badge">' + escHtml(t.arcTypeId || '') + '</span>';
                    h += '<span class="arc-version">v' + escHtml(t.version || '1.0') + '</span>';
                    h += '<span class="arc-status ' + (String(t.status || 'Active').toLowerCase() === 'active' ? 'active' : 'inactive') + '">' + escHtml(t.status || 'Active') + '</span></div>';
                    h += '<div class="meta-line"><b>说明：</b>' + escHtml(t.description || '') + '</div>';
                    h += '<div class="meta-line"><b>时长预算：</b>整场建议 ' + (budget.minSeconds || '-') + '-' + (budget.maxSeconds || '-') + 's，默认 ' + (budget.defaultSeconds || '-') + 's，镜头档位 ' + tiers + '</div>';
                    if (t.rules && t.rules.length) {
                        h += '<div class="meta-line"><b>规则：</b></div><div class="prompt-box">' + t.rules.map(escHtml).join('\n') + '</div>';
                    }
                    h += '<details class="arc-phases"><summary>阶段明细（' + (t.phases ? t.phases.length : 0) + ' 个）</summary>';
                    h += '<table class="phase-table"><thead><tr><th>#</th><th>阶段</th><th>目的</th><th>占比</th><th>秒数</th><th>镜头</th><th>景别</th><th>运镜</th><th>VFX</th><th>技能</th><th>台词</th><th>结束状态</th><th>进入条件</th></tr></thead><tbody>';
                    for (var p = 0; p < (t.phases || []).length; p++) {
                        var ph = t.phases[p];
                        h += '<tr><td>' + (ph.phaseNo || p + 1) + '</td><td>' + escHtml(ph.name || '') + '</td><td>' + escHtml(ph.purpose || '') + '</td><td>' + (ph.durationPercent || 0) + '%</td><td>' + (ph.minSeconds || 0) + '-' + (ph.maxSeconds || 0) + 's</td><td>' + (ph.shotCount || 0) + '</td><td>' + escHtml(ph.shotStyle || '') + '</td><td>' + escHtml(ph.camera || '') + '</td><td>' + (ph.vfxLevel || 0) + '%</td><td>' + escHtml((ph.skills || []).join('、')) + '</td><td>' + escHtml(ph.dialogue || '') + '</td><td>' + escHtml(ph.endState || '') + '</td><td>' + escHtml(ph.nextCondition || '') + '</td></tr>';
                    }
                    h += '</tbody></table></details>';
                    h += '<div class="arc-actions"><button class="btn-xs primary" onclick="copyArc(this,' + t.fightArcTemplateId + ')">复制骨架</button></div>';
                    h += '</div>';
                }
                $('#arcList').html(h);
                $('.arc-count').text('共 ' + d.length + ' 套');
                $('.arc-total').text('共 ' + d.length + ' 套');
            }).fail(function () { $('#arcList').html('<p style="color:#ef4444;text-align:center;">加载失败</p>'); });
        }

        function getArcById(id, cb) {
            $.get('/api/fight-arc/list', {}, function (d) {
                if (!Array.isArray(d)) { alert('骨架接口未就绪，请重新运行服务'); return; }
                for (var i = 0; i < d.length; i++) { if (d[i].fightArcTemplateId === parseInt(id)) { cb(d[i]); return; } }
                alert('未找到骨架');
            });
        }

        function copyArc(btn, id) {
            getArcById(id, function (t) { copyText(btn, buildArcText(t)); });
        }

        function buildArcText(t) {
            var lines = [];
            var b = t.durationBudget || {};
            lines.push('【' + (t.name || '') + '】' + (t.arcTypeId || '') + ' v' + (t.version || '1.0'));
            lines.push('说明：' + (t.description || ''));
            lines.push('时长预算：' + (b.minSeconds || '-') + '-' + (b.maxSeconds || '-') + 's（默认 ' + (b.defaultSeconds || '-') + 's）');
            if (t.rules && t.rules.length) { lines.push('规则：'); for (var r = 0; r < t.rules.length; r++) { lines.push('- ' + t.rules[r]); } }
            if (t.phases && t.phases.length) {
                lines.push('阶段：');
                for (var p = 0; p < t.phases.length; p++) {
                    var ph = t.phases[p];
                    var extra = (ph.skills && ph.skills.length ? '；技能:' + ph.skills.join('、') : '') + (ph.dialogue ? '；台词:' + ph.dialogue : '');
                    lines.push('  ' + (ph.phaseNo || p + 1) + '. ' + (ph.name || '') + '（' + (ph.durationPercent || 0) + '%）：' + (ph.purpose || '') + '；景别:' + (ph.shotStyle || '按镜头') + '；运镜:' + (ph.camera || '按镜头') + '；镜头数:' + (ph.shotCount || 0) + '；VFX:' + (ph.vfxLevel || 0) + '%' + extra + '；结束状态:' + (ph.endState || '') + '；进入条件:' + (ph.nextCondition || ''));
                }
            }
            return lines.join('\n');
        }

        function showAdd() {
            _editId = 0;
            $('#modalTitle').text('新增模板');
            $('#fName').val(''); $('#fTier').val('3'); $('#fDur').val('11');
            $('#fScene').val(''); $('#fBeat').val('');
            $('#fAction').val(''); $('#fCamera').val(''); $('#fConstraint').val(''); $('#fTags').val('');
            $('#editModal').css('display', 'flex');
        }

        function showEdit(id) {
            $.get('/api/fight/list', {}, function (d) {
                var t = null;
                for (var i = 0; i < d.length; i++) { if (d[i].fightTemplateId === id) { t = d[i]; break; } }
                if (!t) { alert('未找到模板'); return; }
                _editId = id;
                $('#modalTitle').text('编辑模板');
                $('#fName').val(t.name);
                $('#fTier').val(String(t.tier || 3));
                $('#fDur').val(String(t.duration || 11));
                $('#fScene').val(t.scene || '');
                $('#fBeat').val(t.beat || '');
                $('#fAction').val(t.actionPrompt || '');
                $('#fCamera').val(t.cameraPrompt || '');
                $('#fConstraint').val(t.constraintPrompt || '');
                $('#fTags').val(t.tags || '');
                $('#editModal').css('display', 'flex');
            });
        }

        function doSave() {
            var name = $('#fName').val().trim();
            if (!name) { alert('模板名不能为空'); return; }
            var payload = {
                name: name,
                tier: parseInt($('#fTier').val()) || 3,
                duration: parseInt($('#fDur').val()) || 11,
                scene: $('#fScene').val(),
                beat: $('#fBeat').val(),
                actionPrompt: $('#fAction').val(),
                cameraPrompt: $('#fCamera').val(),
                constraintPrompt: $('#fConstraint').val(),
                tags: $('#fTags').val()
            };
            var url = _editId ? '/api/fight/' + _editId : '/api/fight';
            var method = _editId ? 'PUT' : 'POST';
            $.ajax({
                url: url, method: method, contentType: 'application/json', data: JSON.stringify(payload),
                success: function () { $('#editModal').hide(); loadFights(); },
                error: function (x) { alert('保存失败: ' + (x.responseJSON && x.responseJSON.message ? x.responseJSON.message : x.statusText)); }
            });
        }

        function delFight(id) {
            if (!confirm('确定删除该模板？')) return;
            $.ajax({
                url: '/api/fight/' + id, method: 'DELETE',
                success: function () { loadFights(); },
                error: function (x) { alert('删除失败: ' + (x.responseJSON && x.responseJSON.message ? x.responseJSON.message : x.statusText)); }
            });
        }

        function getById(id, cb) {
            $.get('/api/fight/list', {}, function (d) {
                for (var i = 0; i < d.length; i++) { if (d[i].fightTemplateId === parseInt(id)) { cb(d[i]); return; } }
                alert('未找到模板');
            });
        }

        function copyFull(btn, id) {
            getById(id, function (t) {
                var txt = '动作行:' + (t.actionPrompt || '') + '\n运镜行:' + (t.cameraPrompt || '') + '\n约束行:' + (t.constraintPrompt || '');
                copyText(btn, txt);
            });
        }

        function copyOne(btn, id, kind) {
            getById(id, function (t) {
                var txt = kind === 'action' ? (t.actionPrompt || '') : kind === 'camera' ? (t.cameraPrompt || '') : (t.constraintPrompt || '');
                if (!txt) { alert('该行为空'); return; }
                copyText(btn, txt);
            });
        }

        function copyText(btn, txt) {
            if (!txt) { alert('内容为空'); return; }
            function done() { btn.innerHTML = '已复制'; setTimeout(function () { btn.innerHTML = '复制'; }, 1200); }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(done).catch(function () { fallbackCopy(txt); done(); });
            } else { fallbackCopy(txt); done(); }
        }

        function fallbackCopy(txt) {
            var ta = document.createElement('textarea');
            ta.value = txt; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) { }
            document.body.removeChild(ta);
        }

        $(function () {
            $.get('/api/auth/me', function (u) { if (u && u.userId > 0) { if (typeof API !== 'undefined' && API.updateUI) API.updateUI(u); loadFights(); loadArcs(); } else { window.location.href = 'login.html'; } }).fail(function () { window.location.href = 'login.html'; });
            $('#btnLogout').click(function () { $.post('/api/auth/logout').done(function () { window.location.href = '/'; }); });
        });
    </script>
</body>
</html>
