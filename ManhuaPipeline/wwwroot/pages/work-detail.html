  <script>
    function escHtml(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

    function fmtTime(t){
      if(!t) return '';
      var d = new Date(t);
      if(isNaN(d.getTime())) return String(t);
      var p = function(n){ return (n<10?'0':'')+n; };
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    }

    function loadDetail(){
      var id = new URLSearchParams(location.search).get('id');
      if(!id){ $('#detailBody').html('<p class="empty-tip">缺少作品 ID</p>'); return; }
      $.get('/api/works/' + id, function(w){
        if(!w){ $('#detailBody').html('<p class="empty-tip">作品不存在</p>'); return; }

        var videoHtml = '';
        if(w.workUrl){
          if(/.(mp4|webm|mov|m4v)$/i.test(w.workUrl)){
            videoHtml = '<video src="' + w.workUrl + '" controls autoplay preload="metadata" controlsList="nodownload" disablepictureinpicture oncontextmenu="return false;" style="width:100%;height:100%;border-radius:12px;background:#000;"></video>';
          } else {
            videoHtml = '<a href="' + escHtml(w.workUrl) + '" target="_blank" style="color:#a78bfa;font-size:14px;">点击打开作品链接</a>';
          }
        } else {
          videoHtml = '<span style="color:#64748b;font-size:14px;">暂无视频</span>';
        }

        var h = '';
        h += '<h1 class="detail-title">' + escHtml(w.title) + '</h1>';
        h += '<div class="video-area">' + videoHtml + '</div>';
        h += '<div class="detail-meta">';
        h += '<span class="meta-item"><span class="material-icons">person</span> 上传作者：' + escHtml(w.authorName || '未知') + '</span>';
        h += '<span class="meta-item"><span class="material-icons">schedule</span> 上传时间：' + fmtTime(w.createdAt) + '</span>';
        h += '</div>';
        h += '<div class="detail-desc"><h3>作品详情</h3><p>' + (w.description ? escHtml(w.description) : '暂无描述') + '</p></div>';
        $('#detailBody').html(h);
      }).fail(function(x){ $('#detailBody').html('<p class="empty-tip">加载失败：' + (x.responseJSON?.message || x.statusText) + '</p>'); });
    }

    $(function(){
      $.get('/api/auth/me', function(u){ if(u && u.userId>0 && typeof API !== 'undefined' && API.updateUI) API.updateUI(u); });
      loadDetail();
    });
  </script>

<script>
  (function() {
    var canvas = document.getElementById("particleCanvas");
    if (!canvas) return;
    canvas.style.top = "0";
    canvas.style.width = "100%";
    canvas.style.pointerEvents = "none";
    var ctx = canvas.getContext("2d");
    var W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);
    var particles = [];
    var COUNT = 70;
    var colors = ["rgba(124,58,237,", "rgba(59,130,246,", "rgba(167,139,250,"];
    for (var i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 1.2,
        dx: (Math.random() - 0.5) * 0.4, dy: (Math.random() - 0.5) * 0.4 - 0.15,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: Math.random() * 0.4 + 0.15
      });
    }
    var CONNECT_DIST = 130;
    function anim() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < COUNT; i++) {
        var p = particles[i];
        p.x += p.dx; p.y += p.dy;
        if (p.x < 0 || p.x > W) p.dx *= -1;
        if (p.y < 0 || p.y > H) p.dy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color + p.alpha + ")";
        ctx.fill();
        for (var j = i + 1; j < COUNT; j++) {
          var q = particles[j];
          var dx = p.x - q.x;
          var dy = p.y - q.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < CONNECT_DIST) {
            var alpha = (1 - dist / CONNECT_DIST) * 0.2;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = "rgba(124,58,237," + alpha + ")";
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(anim);
    }
    anim();
  })();

  function showBatchUpload(){ $('#batchFiles').val(''); $('#batchTags').val(''); $('#batchPreview').hide(); $('#batchProgress').hide(); $('#batchResult').hide(); $('#batchUploadModal').css('display','flex'); }
  function closeBatchUpload(){ $('#batchUploadModal').hide(); }
  $('#batchFiles').on('change',function(){
    var count = this.files.length;
    if(count>0){ $('#batchCount').text(count); $('#batchPreview').show(); }
    else{ $('#batchPreview').hide(); }
  });
  function doBatchUpload(){
    var files = $('#batchFiles')[0].files;
    if(!files||files.length===0){ alert('请选择图片'); return; }
    var cat = $('#batchCategory').val();
    var sub = $('#batchSubCategory').val();
    var fd = new FormData();
    for(var i=0;i<files.length;i++) fd.append('files', files[i]);
    fd.append('category', cat);
    fd.append('subCategory', sub);
    fd.append('tags', $('#batchTags').val());
    $('#batchProgress').show();
    $('#batchResult').hide();
    var total = files.length;
    $('#batchProgressText').text('0 / '+total);
    $('#batchProgressBar').css('width','0%');
    $('.btn-primary:contains(开始上传)').prop('disabled',true).text('上传中...');
    $.ajax({url:'/api/reference/upload-batch', method:'POST', data:fd, processData:false, contentType:false,
      xhr:function(){
        var xhr = new XMLHttpRequest();
        xhr.upload.addEventListener('progress',function(e){
          if(e.lengthComputable){ var pct=Math.round(e.loaded/e.total*100); $('#batchProgressBar').css('width',pct+'%'); $('#batchProgressText').text(Math.round(e.loaded/total/1024)+'KB / '+Math.round(e.total/1024)+'KB'); }
        },false);
        return xhr;
      },
      success:function(r){
        var msg='上传完成：成功 '+r.success+' 张';
        if(r.failed>0) msg+=', 失败 '+r.failed+' 张';
        $('#batchProgressBar').css('width','100%');
        $('#batchResult').html('<span style="color:#22c55e;">'+msg+'</span>').show();
        $('.btn-primary:contains(上传中...)').prop('disabled',false).text('开始上传');
        closeBatchUpload(); loadAssets();
      },
      error:function(x){
        $('#batchResult').html('<span style="color:#ef4444;">上传失败: '+(x.responseJSON?.message||x.statusText)+'</span>').show();
        $('.btn-primary:contains(上传中...)').prop('disabled',false).text('开始上传');
      }
    });
  }

</script>
