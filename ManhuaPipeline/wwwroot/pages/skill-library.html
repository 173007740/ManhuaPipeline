        .tier-3 { background: rgba(59,130,246,0.15); color: #60a5fa; }

    <script>
        function escHtml(s) { if (!s) return ""; return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
        var _editId = 0;
        var _editingElementId = 0;
        var elements = [];

        var tierNames = { 1: "T1 拳拳到肉", 2: "T2 刀兵对砍", 3: "T3 技能拉满", 4: "T4 特效拉满", 5: "T5 大招释放" };
        var elClasses = { 火: "el-fire", 冰: "el-ice", 雷: "el-thunder", 剑阵: "el-sword", 风: "el-wind", 暗: "el-dark", 圣: "el-holy" };

        function elStyle(name) {
            if (elClasses[name]) return '';
            var palette = [
                ['rgba(239,68,68,0.15)', '#f87171'],
                ['rgba(56,189,248,0.15)', '#38bdf8'],
                ['rgba(168,85,247,0.18)', '#c084fc'],
                ['rgba(52,211,153,0.15)', '#34d399'],
                ['rgba(251,191,36,0.15)', '#fbbf24'],
                ['rgba(236,72,153,0.15)', '#f472b6'],
                ['rgba(14,165,233,0.15)', '#38bdf8']
            ];
            var h = 0;
            for (var i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) >>> 0;
            var c = palette[h % palette.length];
            return 'background:' + c[0] + ';color:' + c[1] + ';';
        }


        function skillQueryParams() {
            var q = { element: $('#filterElement').val(), tier: $('#filterTier').val() || undefined, search: $('#searchInput').val() };
            var tag = $('#filterTags').val().trim();
            if (tag) q.tags = tag;
            var owner = $('#filterOwner').val().trim();
            if (owner) q.owner = owner;
            return q;
        }


        function loadElements() {
            return $.get('/api/skill/elements', function (d) {
                elements = d || [];
                refreshElementSelects();
                if ($('#elementModal').is(':visible')) renderElementList();
            });
        }

        function refreshElementSelects() {
            var curFilter = $('#filterElement').val();
            var curForm = $('#fElement').val();
            var fh = '<option value="">全部系别</option>';
            var mh = '';
            for (var i = 0; i < elements.length; i++) {
                var n = elements[i].name;
                var v = escHtml(n);
                fh += '<option value="' + v + '">' + escHtml(n) + '系</option>';
                mh += '<option value="' + v + '">' + escHtml(n) + '系</option>';
            }
            if (!elements.length) mh = '<option value="">暂无系别</option>';
            $('#filterElement').html(fh).val(curFilter);
            $('#fElement').html(mh).val(curForm);
        }

        function loadSkills() {
            $.get('/api/skill/list', skillQueryParams(), function (d) {
                if (!d || d.length === 0) { $('#skillList').empty(); $('#skillEmpty').show(); $('.skill-count').text(''); return; }
                $('#skillEmpty').hide();
                var h = '';
                for (var i = 0; i < d.length; i++) {
                    var s = d[i];
                    var elCls = elClasses[s.element] || '';
                    var elExtra = elStyle(s.element);
                    var tierCls = 'tier-' + (s.tier || 4);
                    h += '<div class="skill-card">';
                    h += '<div class="skill-thumb" onclick="' + (s.imageUrl ? "previewImg('" + s.imageUrl + "')" : 'void(0)') + '">';
                    if (s.imageUrl) { h += '<img src="' + s.imageUrl + '" loading="lazy" decoding="async" onerror="this.style.display=&#39;none&#39;">'; }
                    else { h += '<div class="no-img">暂无参考图<br>出图后上传</div>'; }
                    h += '</div>';
                    h += '<div class="skill-body">';
                    h += '<div class="skill-title"><span class="name">' + escHtml(s.name) + '</span>';
                    if (s.element) { h += '<span class="el-tag ' + elCls + '" style="' + elExtra + '">' + escHtml(s.element) + '系</span>'; }
                    if (s.ownerCharacter) { h += '<span class="owner-badge" style="background:rgba(59,130,246,0.15);color:#93c5fd;">' + escHtml(s.ownerCharacter) + '</span>'; }
                    h += '<span class="tier-badge ' + tierCls + '">' + (tierNames[s.tier] || 'T' + s.tier) + '</span></div>';
                    h += '<div class="prompt-head"><label>出图版</label></div>';
                    h += '<div class="prompt-box">' + escHtml(s.promptImage || '（空）') + '</div>';
                    h += '<div class="prompt-head"><label>视频版</label></div>';
                    h += '<div class="prompt-box">' + escHtml(s.promptVideo || '（空）') + '</div>';
                    if (s.tags) { var tagArr = String(s.tags).split(',').map(function (t) { return t.trim(); }).filter(Boolean); if (tagArr.length > 0) { h += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;">'; for (var ti = 0; ti < tagArr.length; ti++) { h += '<span class="tag-mini">#' + escHtml(tagArr[ti]) + '</span>'; } h += '</div>'; } }
                    h += '<div class="skill-actions">';
                    h += '<button class="btn-xs primary" onclick="copyText(this,' + s.skillId + ',\'image\')">复制出图</button>';
                    h += '<button class="btn-xs green" onclick="copyText(this,' + s.skillId + ',\'video\')">复制视频</button>';
                    h += '<button class="btn-xs" onclick="showEdit(' + s.skillId + ')">编辑</button>';
                    h += '<button class="btn-xs" onclick="showUploadImg(' + s.skillId + ')">' + (s.imageUrl ? '换图' : '传图') + '</button>';
                    h += '<button class="btn-xs red" onclick="delSkill(' + s.skillId + ')">删除</button>';
                    h += '</div>';
                    h += '</div></div>';
                }
                $('#skillList').html(h);
                $('.skill-count').text('共 ' + d.length + ' 个技能');
            }).fail(function () { $('#skillList').html('<p style="color:#ef4444;text-align:center;">加载失败</p>'); });
        }

        function showAdd() {
            _editId = 0;
            $('#modalTitle').text('新增技能');
            $('#fName').val('');
            $('#fElement').val(elements.length ? elements[0].name : '');
            $('#fTier').val('4');
            $('#fOwner').val('');
            $('#fPromptImage').val(''); $('#fPromptVideo').val(''); $('#fTags').val('');
            $('#editModal').css('display', 'flex');
        }

        function showEdit(id) {
            $.get('/api/skill/list', skillQueryParams(), function (d) {
                var s = null;
                for (var i = 0; i < d.length; i++) { if (d[i].skillId === id) { s = d[i]; break; } }
                if (!s) { alert('未找到技能'); return; }
                _editId = id;
                $('#modalTitle').text('编辑技能');
                $('#fName').val(s.name);
                $('#fElement').val(s.element || '');
                $('#fTier').val(String(s.tier || 4));
                $('#fOwner').val(s.ownerCharacter || '');
                $('#fPromptImage').val(s.promptImage || '');
                $('#fPromptVideo').val(s.promptVideo || '');
                $('#fTags').val(s.tags || '');
                $('#editModal').css('display', 'flex');
            });
        }

        function doSave() {
            var name = $('#fName').val().trim();
            if (!name) { alert('技能名不能为空'); return; }
            var payload = {
                name: name,
                element: $('#fElement').val(),
                tier: parseInt($('#fTier').val()) || 4,
                promptImage: $('#fPromptImage').val(),
                promptVideo: $('#fPromptVideo').val(),
                tags: $('#fTags').val()
            };
            var owner = $('#fOwner').val().trim();
            if (owner) payload.ownerCharacter = owner;
            var url = _editId ? '/api/skill/' + _editId : '/api/skill';
            var method = _editId ? 'PUT' : 'POST';
            $.ajax({
                url: url, method: method, contentType: 'application/json', data: JSON.stringify(payload),
                success: function () { $('#editModal').hide(); loadSkills(); loadElements(); },
                error: function (x) { alert('保存失败: ' + (x.responseJSON?.message || x.statusText)); }
            });
        }

        function showElementManager() {
            $('#elementModal').css('display', 'flex');
            resetElementForm();
            renderElementList();
        }

        function resetElementForm() {
            _editingElementId = 0;
            $('#elName').val('');
            $('#elSort').val('0');
            $('#btnElementSave').text('新增');
            $('#btnElementCancel').hide();
        }

        function renderElementList() {
            if (!elements.length) { $('#elementList').html('<tr><td colspan="4" style="text-align:center;color:#94a3b8;">暂无系别</td></tr>'); return; }
            var h = '';
            for (var i = 0; i < elements.length; i++) {
                var e = elements[i];
                h += '<tr>';
                h += '<td>' + escHtml(e.name) + '</td>';
                h += '<td>' + e.sortOrder + '</td>';
                h += '<td>' + e.usageCount + '</td>';
                h += '<td><button class="btn-xs" onclick="editElement(' + e.elementId + ')">编辑</button> <button class="btn-xs red" onclick="delElement(' + e.elementId + ')">删除</button></td>';
                h += '</tr>';
            }
            $('#elementList').html(h);
        }

        function editElement(id) {
            for (var i = 0; i < elements.length; i++) {
                if (elements[i].elementId === id) {
                    _editingElementId = id;
                    $('#elName').val(elements[i].name);
                    $('#elSort').val(elements[i].sortOrder);
                    $('#btnElementSave').text('更新');
                    $('#btnElementCancel').show();
                    return;
                }
            }
        }

        function cancelElementEdit() { resetElementForm(); }

        function saveElement() {
            var name = $('#elName').val().trim();
            if (!name) { alert('系别名不能为空'); return; }
            var payload = { name: name, sortOrder: parseInt($('#elSort').val()) || 0 };
            var url = _editingElementId ? '/api/skill/elements/' + _editingElementId : '/api/skill/elements';
            var method = _editingElementId ? 'PUT' : 'POST';
            $.ajax({
                url: url, method: method, contentType: 'application/json', data: JSON.stringify(payload),
                success: function () { resetElementForm(); loadElements(); loadSkills(); },
                error: function (x) { alert('保存失败: ' + (x.responseJSON?.message || x.statusText)); }
            });
        }

        function delElement(id) {
            if (!confirm('确定删除该系别？')) return;
            $.ajax({
                url: '/api/skill/elements/' + id, method: 'DELETE',
                success: function () { loadElements(); loadSkills(); },
                error: function (x) { alert('删除失败: ' + (x.responseJSON?.message || x.statusText)); }
            });
        }

        var _imgSkillId = 0;
        function showUploadImg(id) {
            _imgSkillId = id;
            $('#imgFile').val(''); $('#imgPreviewWrap').hide();
            $('#imgModal').css('display', 'flex');
        }
        $('#imgFile').on('change', function () {
            var file = this.files[0];
            if (!file) return;
            var r = new FileReader();
            r.onload = function (e) { $('#imgPreview').attr('src', e.target.result); $('#imgPreviewWrap').show(); };
            r.readAsDataURL(file);
        });
        function doUploadImg() {
            var file = $('#imgFile')[0].files[0];
            if (!file) { alert('请选择图片'); return; }
            var fd = new FormData();
            fd.append('file', file);
            $.ajax({
                url: '/api/skill/' + _imgSkillId + '/image', method: 'POST', data: fd, processData: false, contentType: false,
                success: function () { $('#imgModal').hide(); loadSkills(); },
                error: function (x) { alert('上传失败: ' + (x.responseJSON?.message || x.statusText)); }
            });
        }

        function delSkill(id) {
            if (!confirm('确定删除该技能？')) return;
            $.ajax({
                url: '/api/skill/' + id, method: 'DELETE',
                success: function () { loadSkills(); loadElements(); },
                error: function (x) { alert('删除失败: ' + (x.responseJSON?.message || x.statusText)); }
            });
        }

        function copyText(btn, id, kind) {
            $.get('/api/skill/list', skillQueryParams(), function (d) {
                var s = null;
                for (var i = 0; i < d.length; i++) { if (d[i].skillId === parseInt(id)) { s = d[i]; break; } }
                if (!s) { alert('未找到技能'); return; }
                var txt = kind === 'image' ? (s.promptImage || '') : (s.promptVideo || '');
                if (!txt) { alert('该版本提示词为空'); return; }
                if (kind === 'image') {
                    var head = '【' + s.name + '】';
                    if (s.element) head += s.element + '系';
                    if (s.tier) head += ' · ' + (tierNames[s.tier] || 'T' + s.tier);
                    txt = head + '\n' + txt;
                }
                function done() { btn.innerHTML = '已复制'; setTimeout(function () { btn.innerHTML = kind === 'image' ? '复制出图' : '复制视频'; }, 1200); }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(done).catch(function () { fallbackCopy(txt); done(); });
                } else { fallbackCopy(txt); done(); }
            });
        }
        function fallbackCopy(txt) {
            var ta = document.createElement('textarea');
            ta.value = txt; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) { }
            document.body.removeChild(ta);
        }

        function previewImg(src) { $('#previewLarge').attr('src', src); $('#previewOverlay').css('display', 'flex'); }

        $(function () {
            $.get('/api/auth/me', function (u) { if (u && u.userId > 0) { if (typeof API !== 'undefined' && API.updateUI) API.updateUI(u); loadElements().done(function () { loadSkills(); }); } else { window.location.href = 'login.html'; } }).fail(function () { window.location.href = 'login.html'; });
            $('#btnLogout').click(function () { $.post('/api/auth/logout').done(function () { window.location.href = '/'; }); });
        });
    </script>
</body>
</html>
